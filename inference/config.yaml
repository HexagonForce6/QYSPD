# config.yaml

model:
  model_path: path_to_llm
  batch_size: 32
  n_models_parallel:
  gpu_memory_utilization:
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.2
  max_tokens: 512

prompts:
  prompt_path: path_to_prompt_json_file # format: { char: {"match": {"total": ..., "orig": ..., "variant": ...}, "occurrences": [ [indx, start_pos, is_variant, sentence], ... ]}, ... }
  pair_path: path_to_pair_json_file # format: { char: [[fanqie, def], [...]], ...  }
  variant_path: path_to_variant_txt_file # format: orig_char variant_char1 variant_char2 ...
  progress_path: path_to_output_log_file